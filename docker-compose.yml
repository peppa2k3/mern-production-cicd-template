
# Local / CI only.
# Production uses docker-compose.prod.yml.
# MongoDB and MinIO in this file are isolated test services.

services:
  mongo:
    image: mongo:4.0.28
    restart: unless-stopped
    volumes:
      - mongo40-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongo
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: peppa2k3/minio-minio:rel250723
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Run node scripts/init-env.cjs first}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run node scripts/init-env.cjs first}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: mern-server:${IMAGE_TAG:-local}
    build: ./server
    restart: unless-stopped
    env_file: ${SERVER_ENV_FILE:-./server/.env}
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:${WEB_PORT:-8080}
      TRUST_PROXY_HOPS: 1
      MONGO_URI: mongodb://mongo:27017/affiliate_platform
      UPLOAD_STORAGE: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  client:
    image: mern-client:${IMAGE_TAG:-local}
    build: ./client
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/api/health
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mongo40-data:
  minio-data:
