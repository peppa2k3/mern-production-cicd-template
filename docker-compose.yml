services:
  server:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}-server:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Map port 5000 ra ngoài host VPS để deploy.sh hoặc curl từ VPS kiểm tra được
      - "5000:5000"
    networks:
      - internal
      - edge
    healthcheck:
      # Kiểm tra cổng 5000 (khớp với PORT=5000 trong .env)
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=false"

  client:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}-client:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # Map port 3000 ra host để khớp với script kiểm tra healthcheck port 3000 (nếu script deploy.sh gọi port 3000)
      - "3000:80"
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${APP_NAME}.loadbalancer.server.port=80"

  mongo:
    image: mongo:7
    restart: unless-stopped
    # Khởi tạo User/Password cho MongoDB khớp với MONGO_URI trong .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin1
      MONGO_INITDB_ROOT_PASSWORD: pass1
    volumes:
      - mongo_data:/data/db
    networks:
      - internal

volumes:
  mongo_data:

networks:
  internal:
    driver: bridge
  edge:
    external: true
    name: ${TRAEFIK_NETWORK}