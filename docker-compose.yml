# Production Compose file.
#
# Image tags are never hard-coded: ${IMAGE_TAG} is set by deploy.sh at
# deploy time (exported into the shell environment right before each
# `docker compose` call — see deployment/scripts/common.sh). Everything
# else comes from .env, which lives only on the VPS and is never synced
# from CI.
#
# Assumes Traefik is already running on this VPS as the shared edge
# reverse proxy (handling TLS via Let's Encrypt) and that both containers
# join its external network. If this project doesn't use Traefik, see
# docker-compose.override.example.yml for a direct-port-publishing
# alternative.

services:
  server:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}-server:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - internal
      - edge
    healthcheck:
      # No curl in the slim Node image — use Node's own http client instead.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      # Reached only through the client's Nginx proxy — not exposed directly.
      - "traefik.enable=false"

  client:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_REPO}-client:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${APP_NAME}.loadbalancer.server.port=80"

  # MongoDB running inside Compose. If this project uses an external /
  # managed MongoDB instead, delete this service and point MONGO_URI in
  # .env at the external cluster — never touch the volume below in either
  # case (see docs/deployment.md "MongoDB safety").
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    # Deliberately no `ports:` — reachable only from other services on the
    # internal network, never exposed to the host or the public internet.

volumes:
  mongo_data:

networks:
  internal:
    driver: bridge
  edge:
    external: true
    name: ${TRAEFIK_NETWORK}
