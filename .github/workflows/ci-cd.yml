# ====================================================================
# [EN] Independent CI/CD for MERN Application (Server & Client decoupled).
# [VI] CI/CD độc lập cho MERN (Tách biệt hoàn toàn Server & Client).
# ====================================================================

name: Decoupled Multi-Env CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CLIENT_DIR: ${{ vars.CLIENT_DIR || 'client' }}
  SERVER_DIR: ${{ vars.SERVER_DIR || 'server' }}
  NODE_VERSION_DEFAULT: ${{ vars.NODE_VERSION_DEFAULT || '22' }}

jobs:
  # --------------------------------------------------------------------
  # [EN] Determine deployment target environment based on git branch.
  # [VI] Xác định môi trường deploy dựa vào branch.
  # --------------------------------------------------------------------
  setup-env:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.env.outputs.target_env }}
      tag_prefix: ${{ steps.env.outputs.tag_prefix }}
    steps:
      - id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target_env=production" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=" >> "$GITHUB_OUTPUT"
          else
            echo "target_env=development" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=dev-" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------
  # [EN] SERVER: Quality Checks (Independent)
  # [VI] SERVER: Kiểm tra chất lượng độc lập
  # --------------------------------------------------------------------
  quality-server:
    name: "Server: Quality Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}

      - name: Install & Check Server
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          set -e
          has_script() { node -e "process.exit(require('./package.json').scripts?.['$1'] ? 0 : 1)"; }

          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if has_script lint; then npm run lint; fi
          if has_script test; then npm test; fi
          if has_script build; then npm run build; fi

  # --------------------------------------------------------------------
  # [EN] CLIENT: Quality Checks (Independent)
  # [VI] CLIENT: Kiểm tra chất lượng độc lập
  # --------------------------------------------------------------------
  quality-client:
    name: "Client: Quality Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}

      - name: Install & Check Client
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          set -e
          has_script() { node -e "process.exit(require('./package.json').scripts?.['$1'] ? 0 : 1)"; }

          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if has_script lint; then npm run lint; fi
          if has_script test; then npm test; fi
          if has_script build; then npm run build; fi

  # --------------------------------------------------------------------
  # [EN] SERVER: Build & Push Docker Image
  # [VI] SERVER: Build và Push Docker Image độc lập
  # --------------------------------------------------------------------
  docker-server:
    name: "Server: Docker Build & Push"
    needs: [setup-env, quality-server]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ needs.setup-env.outputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Tag
        id: vars
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          prefix="${{ needs.setup-env.outputs.tag_prefix }}"
          echo "image_tag=${prefix}sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${prefix}latest" >> "$GITHUB_OUTPUT"
          echo "owner_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Server
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVER_DIR }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_repo }}-server:${{ steps.vars.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_repo }}-server:${{ steps.vars.outputs.latest_tag }}

  # --------------------------------------------------------------------
  # [EN] CLIENT: Build & Push Docker Image (Only needs VITE_API_URL)
  # [VI] CLIENT: Build và Push Docker Image (Chỉ cần VITE_API_URL)
  # --------------------------------------------------------------------
  docker-client:
    name: "Client: Docker Build & Push"
    needs: [setup-env, quality-client]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ needs.setup-env.outputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Tag
        id: vars
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          prefix="${{ needs.setup-env.outputs.tag_prefix }}"
          echo "image_tag=${prefix}sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${prefix}latest" >> "$GITHUB_OUTPUT"
          echo "owner_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Client
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CLIENT_DIR }}
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://demo.techreview.io.vn/api' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_repo }}-client:${{ steps.vars.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_repo }}-client:${{ steps.vars.outputs.latest_tag }}

  # --------------------------------------------------------------------
  # [EN] DEPLOY: Sync files & Deploy to VPS with automatic network handling
  # [VI] DEPLOY: Đồng bộ file & Deploy lên VPS, tự động tạo Network
  # --------------------------------------------------------------------
  deploy:
    name: "Deploy to VPS"
    needs: [setup-env, docker-server, docker-client]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.setup-env.outputs.target_env }}
    concurrency:
      group: deployment-${{ needs.setup-env.outputs.target_env }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync deployment files to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,deployment/scripts/*"
          target: ${{ secrets.VPS_DEPLOY_PATH }}
          strip_components: 0
          overwrite: true

      - name: Execute Deployment & Auto-Create Network
        uses: appleboy/ssh-action@v1.2.1
        env:
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          TAG_PREFIX: ${{ needs.setup-env.outputs.tag_prefix }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK || 'web' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: DEPLOY_PATH,DEPLOY_COMMIT_SHA,TAG_PREFIX,TRAEFIK_NETWORK
          script: |
            set -Eeuo pipefail

            # 1. Khởi tạo Docker Network nếu chưa tồn tại
            echo "Checking Docker network: ${TRAEFIK_NETWORK}..."
            docker network create "${TRAEFIK_NETWORK}" 2>/dev/null || echo "Network '${TRAEFIK_NETWORK}' already exists."

            # 2. Cấp quyền & chạy script deploy
            chmod +x "${DEPLOY_PATH}/deployment/scripts/"*.sh
            SHORT_SHA="$(echo "${DEPLOY_COMMIT_SHA}" | cut -c1-7)"
            
            IMAGE_TAG="${TAG_PREFIX}sha-${SHORT_SHA}" \
            COMMIT_SHA="${DEPLOY_COMMIT_SHA}" \
            DEPLOY_PATH="${DEPLOY_PATH}" \
              "${DEPLOY_PATH}/deployment/scripts/deploy.sh"