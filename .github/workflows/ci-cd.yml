name: Decoupled Multi-Env CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CLIENT_DIR: ${{ vars.CLIENT_DIR || 'client' }}
  SERVER_DIR: ${{ vars.SERVER_DIR || 'server' }}
  NODE_VERSION_DEFAULT: ${{ vars.NODE_VERSION_DEFAULT || '22' }}

jobs:
  setup-env:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.env.outputs.target_env }}
      tag_prefix: ${{ steps.env.outputs.tag_prefix }}
    steps:
      - id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target_env=production" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=" >> "$GITHUB_OUTPUT"
          else
            echo "target_env=development" >> "$GITHUB_OUTPUT"
            echo "tag_prefix=dev-" >> "$GITHUB_OUTPUT"
          fi

  quality-server:
    name: "Server: Quality Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}

      - name: Install & Check Server
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          set -e
          has_script() { node -e "process.exit(require('./package.json').scripts?.['$1'] ? 0 : 1)"; }

          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if has_script lint; then npm run lint; fi
          if has_script test; then npm test; fi
          if has_script build; then npm run build; fi

  quality-client:
    name: "Client: Quality Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_DEFAULT }}

      - name: Install & Check Client
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          set -e
          has_script() { node -e "process.exit(require('./package.json').scripts?.['$1'] ? 0 : 1)"; }

          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if has_script lint; then npm run lint; fi
          if has_script test; then npm test; fi
          if has_script build; then npm run build; fi

  docker-server:
    name: "Server: Docker Build & Push"
    needs: [setup-env, quality-server]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ needs.setup-env.outputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Tag
        id: vars
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          prefix="${{ needs.setup-env.outputs.tag_prefix }}"
          echo "image_tag=${prefix}sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${prefix}latest" >> "$GITHUB_OUTPUT"
          echo "owner_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Server
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVER_DIR }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_repo }}-server:${{ steps.vars.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_repo }}-server:${{ steps.vars.outputs.latest_tag }}

  docker-client:
    name: "Client: Docker Build & Push"
    needs: [setup-env, quality-client]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ needs.setup-env.outputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Tag
        id: vars
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          prefix="${{ needs.setup-env.outputs.tag_prefix }}"
          echo "image_tag=${prefix}sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${prefix}latest" >> "$GITHUB_OUTPUT"
          echo "owner_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Client
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CLIENT_DIR }}
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://apidemo.techreview.io.vn' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_repo }}-client:${{ steps.vars.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_repo }}-client:${{ steps.vars.outputs.latest_tag }}

  deploy:
    name: "Deploy to VPS"
    needs: [setup-env, docker-server, docker-client]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.setup-env.outputs.target_env }}
    concurrency:
      group: deployment-${{ needs.setup-env.outputs.target_env }}
      cancel-in-progress: false
    steps:
      - name: Execute Deployment
        uses: appleboy/ssh-action@v1.2.1
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PREFIX: ${{ needs.setup-env.outputs.tag_prefix }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: REGISTRY,REPO,SHA,PREFIX
          script: |
            set -Eeuo pipefail
            
            # 1. Tính toán Tên Image giống với logic ở job build
            OWNER_REPO=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
            SHORT_SHA=$(echo "$SHA" | cut -c1-7)
            IMAGE_TAG="${PREFIX}sha-${SHORT_SHA}"

            IMAGE_SERVER="${REGISTRY}/${OWNER_REPO}-server:${IMAGE_TAG}"
            IMAGE_CLIENT="${REGISTRY}/${OWNER_REPO}-client:${IMAGE_TAG}"

            # 2. Truy cập vào thư mục trên VPS & Cập nhật file nếu cần
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git pull || echo "Not a git repository, skipping git pull"

            # 3. Cập nhật version Image vào file .env
            # Lưu ý: Nếu trong docker-compose.yml của bạn đang đặt tên biến là IMAGE_BE và IMAGE_FE
            # thì hãy sửa đoạn 'IMAGE_SERVER' và 'IMAGE_CLIENT' thành 'IMAGE_BE' và 'IMAGE_FE' tương ứng.
            sed -i "s|IMAGE_SERVER=.*|IMAGE_SERVER=${IMAGE_SERVER}|" .env
            sed -i "s|IMAGE_CLIENT=.*|IMAGE_CLIENT=${IMAGE_CLIENT}|" .env

            # 4. Khởi động lại hệ thống với image mới nhất
            docker compose pull
            docker compose up -d
            
            # 5. Dọn dẹp các bản build/image rác không còn sử dụng
            docker image prune -f