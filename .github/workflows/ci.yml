name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client
      - name: Lint and build
        run: |
          npm run lint --prefix server
          npm run lint --prefix client
          npm run test:config --prefix server
          npm run build --prefix client
      - name: Deployment regression tests
        run: bash scripts/test-deploy-flow.sh
      - name: Initialize isolated local environment
        run: node scripts/init-env.cjs
      - name: Build and start local test stack
        run: docker compose -p mern-ci --env-file server/.env up -d --build --wait --wait-timeout 240
      - name: Integration smoke on MongoDB 4.0 and MinIO
        run: |
          docker compose -p mern-ci --env-file server/.env exec -T server npm run seed:roles
          docker compose -p mern-ci --env-file server/.env exec -T -e SMOKE_BASE_URL=http://client server npm run test:smoke
          docker compose -p mern-ci --env-file server/.env exec -T server node scripts/test-readiness.js
      - name: Logs on failure
        if: failure()
        run: docker compose -p mern-ci --env-file server/.env logs --tail=100
      - name: Stop isolated CI services
        if: always()
        run: docker compose -p mern-ci --env-file server/.env down
