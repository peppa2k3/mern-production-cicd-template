
name: CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - develop

  workflow_call:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MINIO_IMAGE: tobi312/minio:RELEASE.2025-07-23T15-54-02Z

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install locked dependencies
        run: |
          set -Eeuo pipefail
          npm ci --prefix server
          npm ci --prefix client

      - name: Lint and build
        run: |
          set -Eeuo pipefail
          npm run lint --prefix server
          npm run lint --prefix client
          npm run test:config --prefix server
          npm run build --prefix client

      - name: Deployment regression tests
        run: |
          set -Eeuo pipefail
          bash scripts/test-deploy-flow.sh

      - name: Initialize isolated local environment
        run: |
          set -Eeuo pipefail
          node scripts/init-env.cjs

      - name: Validate CI Compose configuration
        run: |
          set -Eeuo pipefail

          docker compose \
            -p mern-ci \
            --env-file server/.env \
            -f docker-compose.yml \
            config --quiet

          echo "Resolved Docker images:"
          docker compose \
            -p mern-ci \
            --env-file server/.env \
            -f docker-compose.yml \
            config --images

      - name: Pull isolated database and storage images
        run: |
          set -Eeuo pipefail

          docker compose \
            -p mern-ci \
            --env-file server/.env \
            -f docker-compose.yml \
            pull mongo minio

      - name: Build and start local test stack
        run: |
          set -Eeuo pipefail

          docker compose \
            -p mern-ci \
            --env-file server/.env \
            -f docker-compose.yml \
            up -d --build --wait --wait-timeout 240

      - name: Integration smoke on MongoDB 4.0 and MinIO
        run: |
          set -Eeuo pipefail

          docker compose \
            -p mern-ci \
            --env-file server/.env \
            -f docker-compose.yml \
            exec -T server npm run seed:roles

          docker compose \
            -p mern-ci \
            --env-file server/.env \
            -f docker-compose.yml \
            exec -T \
            -e SMOKE_BASE_URL=http://client \
            server npm run test:smoke

          docker compose \
            -p mern-ci \
            --env-file server/.env \
            -f docker-compose.yml \
            exec -T server node scripts/test-readiness.js

      - name: Logs on failure
        if: failure()
        run: |
          docker compose \
            -p mern-ci \
            --env-file server/.env \
            -f docker-compose.yml \
            logs --tail=100

      - name: Stop isolated CI services
        if: always()
        run: |
          docker compose \
            -p mern-ci \
            --env-file server/.env \
            -f docker-compose.yml \
            down --remove-orphans
