# Only application services; MongoDB 4.0/MinIO/Traefik belong to VPS operations.
services:
  server:
    image: ${SERVER_IMAGE:?Set immutable SERVER_IMAGE}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ${SERVER_ENV_FILE:?Set private server.env path}
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      TRUST_PROXY_HOPS: 1
      UPLOAD_STORAGE: minio
      UPLOAD_DIR: uploads
    networks: [web, storage]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?Set existing Traefik network}
      - traefik.http.services.${APP_NAME}-api.loadbalancer.server.port=5000
      - traefik.http.routers.${APP_NAME}-api.rule=Host(`${API_DOMAIN:?Set API domain}`)
      - traefik.http.routers.${APP_NAME}-api.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:?Set existing HTTPS entrypoint}
      - traefik.http.routers.${APP_NAME}-api.tls=true
      - traefik.http.routers.${APP_NAME}-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:?Set existing resolver}
      - traefik.http.routers.${APP_NAME}-api.service=${APP_NAME}-api
      - traefik.http.routers.${APP_NAME}-web-api.rule=Host(`${APP_DOMAIN:?Set frontend domain}`) && (PathPrefix(`/api/`) || PathPrefix(`/uploads/`) || PathPrefix(`/socket.io/`))
      - traefik.http.routers.${APP_NAME}-web-api.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT}
      - traefik.http.routers.${APP_NAME}-web-api.tls=true
      - traefik.http.routers.${APP_NAME}-web-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER}
      - traefik.http.routers.${APP_NAME}-web-api.priority=100
      - traefik.http.routers.${APP_NAME}-web-api.service=${APP_NAME}-api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
  client:
    image: ${CLIENT_IMAGE:?Set immutable CLIENT_IMAGE}
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 120s
    depends_on:
      server: {condition: service_healthy}
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.services.${APP_NAME}-web.loadbalancer.server.port=80
      - traefik.http.routers.${APP_NAME}-web.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.${APP_NAME}-web.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT}
      - traefik.http.routers.${APP_NAME}-web.tls=true
      - traefik.http.routers.${APP_NAME}-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER}
      - traefik.http.routers.${APP_NAME}-web.service=${APP_NAME}-web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  web: {external: true, name: "${TRAEFIK_NETWORK}"}
  storage: {external: true, name: "${STORAGE_NETWORK:?Set existing private storage network}"}
